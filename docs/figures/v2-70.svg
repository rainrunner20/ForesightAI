<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 598" width="960" height="598" role="img" aria-label="Our version 07 | Prompting as a possible fix"><rect x="0" y="0" width="960" height="598" rx="14" fill="#f7f9fc" stroke="none"/><text x="22" y="34" font-family="Arial, sans-serif" font-size="24" fill="#15273a" font-weight="700">Our version 07 | Prompting as a possible fix</text><text x="22" y="62" font-family="Arial, sans-serif" font-size="15" fill="#47576a" font-weight="400">Same incident and comments, different system instruction.</text><text x="22" y="86" font-family="Arial, sans-serif" font-size="12" fill="#60748b" font-weight="700">FICTIONAL TEST INPUTS / ILLUSTRATIVE ANSWERS — NOT MEASURED QWEN RESULTS</text><rect x="22" y="104" width="450" height="396" rx="10" fill="#ffffff" stroke="#ccd6e2"/><text x="36" y="132" font-family="Arial, sans-serif" font-size="17" fill="#15273a" font-weight="700">Baseline</text><rect x="32" y="149" width="430" height="60" rx="8" fill="#eae7f6" stroke="none"/><text x="42" y="168" font-family="Arial, sans-serif" font-size="12" fill="#54427b" font-weight="700">SYSTEM MESSAGE</text><text x="42" y="191" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">You are an assistant.</text><rect x="32" y="219" width="430" height="60" rx="8" fill="#e5f1fb" stroke="none"/><text x="42" y="238" font-family="Arial, sans-serif" font-size="12" fill="#1c5278" font-weight="700">USER FACT</text><text x="42" y="261" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Checkout failures increased by 30% at 2 PM.</text><rect x="32" y="289" width="430" height="60" rx="8" fill="#fff0d8" stroke="none"/><text x="42" y="308" font-family="Arial, sans-serif" font-size="12" fill="#8a5215" font-weight="700">USER COMMENTS</text><text x="42" y="331" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">18 suspect cyberattack; 2 suspect overload.</text><rect x="32" y="359" width="430" height="60" rx="8" fill="#fbe2e2" stroke="none"/><text x="42" y="378" font-family="Arial, sans-serif" font-size="12" fill="#982e35" font-weight="700">POSSIBLE FAILURE</text><text x="42" y="401" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: A. The majority thinks it was hackers.</text><rect x="488" y="104" width="450" height="396" rx="10" fill="#ffffff" stroke="#ccd6e2"/><text x="502" y="132" font-family="Arial, sans-serif" font-size="17" fill="#15273a" font-weight="700">Evidence-first</text><rect x="498" y="149" width="430" height="126" rx="8" fill="#eae7f6" stroke="none"/><text x="508" y="168" font-family="Arial, sans-serif" font-size="12" fill="#54427b" font-weight="700">SYSTEM MESSAGE</text><text x="508" y="191" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Separate observations from opinions. Consider</text><text x="508" y="213" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">alternatives. Do not commit to a cause without</text><text x="508" y="235" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">sufficient evidence; revise when decisive</text><text x="508" y="257" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">evidence arrives.</text><rect x="498" y="285" width="430" height="60" rx="8" fill="#e5f1fb" stroke="none"/><text x="508" y="304" font-family="Arial, sans-serif" font-size="12" fill="#1c5278" font-weight="700">SAME USER FACT</text><text x="508" y="327" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Checkout failures increased by 30% at 2 PM.</text><rect x="498" y="355" width="430" height="60" rx="8" fill="#fff0d8" stroke="none"/><text x="508" y="374" font-family="Arial, sans-serif" font-size="12" fill="#8a5215" font-weight="700">SAME USER COMMENTS</text><text x="508" y="397" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">18 suspect cyberattack; 2 suspect overload.</text><rect x="498" y="425" width="430" height="60" rx="8" fill="#dff1e6" stroke="none"/><text x="508" y="444" font-family="Arial, sans-serif" font-size="12" fill="#246b48" font-weight="700">EXPECTED ANSWER</text><text x="508" y="467" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: C. The cause is not established.</text><rect x="22" y="514" width="916" height="70" rx="10" fill="#e6edf5" stroke="none"/><text x="34" y="534" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">Measure: does the instruction reduce premature commitment without making Qwen refuse to answer after</text><text x="34" y="556" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">proof? Both strategies must be tested; the answer examples are not predictions.</text></svg>