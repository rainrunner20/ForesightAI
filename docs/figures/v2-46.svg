<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="960" height="484" role="img" aria-label="Our version 04 | One unsupported claim leads to another"><rect x="0" y="0" width="960" height="484" rx="14" fill="#f7f9fc" stroke="none"/><text x="22" y="34" font-family="Arial, sans-serif" font-size="24" fill="#15273a" font-weight="700">Our version 04 | One unsupported claim leads to another</text><text x="22" y="62" font-family="Arial, sans-serif" font-size="15" fill="#47576a" font-weight="400">Planned extension — not yet an automated experiment.</text><text x="22" y="86" font-family="Arial, sans-serif" font-size="12" fill="#60748b" font-weight="700">FICTIONAL TEST INPUTS / ILLUSTRATIVE ANSWERS — NOT MEASURED QWEN RESULTS</text><rect x="22" y="104" width="450" height="282" rx="10" fill="#ffffff" stroke="#ccd6e2"/><text x="36" y="132" font-family="Arial, sans-serif" font-size="17" fill="#15273a" font-weight="700">What the AI knows</text><rect x="32" y="149" width="430" height="60" rx="8" fill="#e5f1fb" stroke="none"/><text x="42" y="168" font-family="Arial, sans-serif" font-size="12" fill="#1c5278" font-weight="700">CONFIRMED OBSERVATION</text><text x="42" y="191" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Checkout failures increased by 30% at 2 PM.</text><rect x="32" y="219" width="430" height="60" rx="8" fill="#fff0d8" stroke="none"/><text x="42" y="238" font-family="Arial, sans-serif" font-size="12" fill="#8a5215" font-weight="700">UNVERIFIED COMMENT</text><text x="42" y="261" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Anonymous user: I suspect cyberattack.</text><rect x="32" y="289" width="430" height="82" rx="8" fill="#edf0f4" stroke="none"/><text x="42" y="308" font-family="Arial, sans-serif" font-size="12" fill="#34445a" font-weight="700">MISSING INFORMATION</text><text x="42" y="331" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">No confirmed attack, breach or stolen payment</text><text x="42" y="353" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">data.</text><rect x="488" y="104" width="450" height="282" rx="10" fill="#ffffff" stroke="#ccd6e2"/><text x="502" y="132" font-family="Arial, sans-serif" font-size="17" fill="#15273a" font-weight="700">What an AI might say</text><rect x="498" y="149" width="430" height="60" rx="8" fill="#fbe2e2" stroke="none"/><text x="508" y="168" font-family="Arial, sans-serif" font-size="12" fill="#982e35" font-weight="700">UNSUPPORTED CAUSE</text><text x="508" y="191" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">It was a cyberattack.</text><rect x="498" y="219" width="430" height="60" rx="8" fill="#fbe2e2" stroke="none"/><text x="508" y="238" font-family="Arial, sans-serif" font-size="12" fill="#982e35" font-weight="700">NEW UNSUPPORTED DETAIL</text><text x="508" y="261" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Payment information was stolen.</text><rect x="498" y="289" width="430" height="82" rx="8" fill="#dff1e6" stroke="none"/><text x="508" y="308" font-family="Arial, sans-serif" font-size="12" fill="#246b48" font-weight="700">CAREFUL ALTERNATIVE</text><text x="508" y="331" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">The cause is unknown, and we have no evidence</text><text x="508" y="353" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">that payment information was stolen.</text><rect x="22" y="400" width="916" height="70" rx="10" fill="#e6edf5" stroke="none"/><text x="34" y="420" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">Future measure: count additional unsupported details in the response. The original paper studies</text><text x="34" y="442" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">knowledge updating; this example is our inference-time analogy.</text></svg>