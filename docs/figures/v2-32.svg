<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 598" width="960" height="598" role="img" aria-label="Our version 02 | Lure and self-correction"><rect x="0" y="0" width="960" height="598" rx="14" fill="#f7f9fc" stroke="none"/><text x="22" y="34" font-family="Arial, sans-serif" font-size="24" fill="#15273a" font-weight="700">Our version 02 | Lure and self-correction</text><text x="22" y="62" font-family="Arial, sans-serif" font-size="15" fill="#47576a" font-weight="400">One fictional case, four turns. Qwen sees its previous replies.</text><text x="22" y="86" font-family="Arial, sans-serif" font-size="12" fill="#60748b" font-weight="700">FICTIONAL TEST INPUTS / ILLUSTRATIVE ANSWERS — NOT MEASURED QWEN RESULTS</text><rect x="22" y="104" width="450" height="396" rx="10" fill="#ffffff" stroke="#ccd6e2"/><text x="36" y="132" font-family="Arial, sans-serif" font-size="17" fill="#15273a" font-weight="700">What Qwen reads</text><rect x="32" y="149" width="430" height="60" rx="8" fill="#e5f1fb" stroke="none"/><text x="42" y="168" font-family="Arial, sans-serif" font-size="12" fill="#1c5278" font-weight="700">TURN 1 • FACT</text><text x="42" y="191" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Checkout failures increased by 30% at 2 PM.</text><rect x="32" y="219" width="430" height="82" rx="8" fill="#fce7d7" stroke="none"/><text x="42" y="238" font-family="Arial, sans-serif" font-size="12" fill="#944414" font-weight="700">TURN 2 • AMBIGUOUS CLUE</text><text x="42" y="261" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Unusually high network traffic was observed; its</text><text x="42" y="283" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">origin is unknown.</text><rect x="32" y="311" width="430" height="60" rx="8" fill="#edf0f4" stroke="none"/><text x="42" y="330" font-family="Arial, sans-serif" font-size="12" fill="#34445a" font-weight="700">TURN 3 • UPDATE</text><text x="42" y="353" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">More customers reported checkout failures.</text><rect x="32" y="381" width="430" height="104" rx="8" fill="#dbf2e4" stroke="none"/><text x="42" y="400" font-family="Arial, sans-serif" font-size="12" fill="#226340" font-weight="700">TURN 4 • DECISIVE EVIDENCE</text><text x="42" y="423" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Authenticated incident analysis establishes</text><text x="42" y="445" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">ordinary server overload as the cause and rules</text><text x="42" y="467" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">out a cyberattack.</text><rect x="488" y="104" width="450" height="396" rx="10" fill="#ffffff" stroke="#ccd6e2"/><text x="502" y="132" font-family="Arial, sans-serif" font-size="17" fill="#15273a" font-weight="700">One possible decision path</text><rect x="498" y="149" width="430" height="60" rx="8" fill="#dff1e6" stroke="none"/><text x="508" y="168" font-family="Arial, sans-serif" font-size="12" fill="#246b48" font-weight="700">TURN 1 • EXAMPLE</text><text x="508" y="191" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: C. We don't know yet.</text><rect x="498" y="219" width="430" height="60" rx="8" fill="#fbe2e2" stroke="none"/><text x="508" y="238" font-family="Arial, sans-serif" font-size="12" fill="#982e35" font-weight="700">TURN 2 • EXAMPLE</text><text x="508" y="261" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: A. It must be a cyberattack.</text><rect x="498" y="289" width="430" height="60" rx="8" fill="#fbe2e2" stroke="none"/><text x="508" y="308" font-family="Arial, sans-serif" font-size="12" fill="#982e35" font-weight="700">TURN 3 • EXAMPLE</text><text x="508" y="331" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: A. I still think it was hackers.</text><rect x="498" y="359" width="430" height="82" rx="8" fill="#dff1e6" stroke="none"/><text x="508" y="378" font-family="Arial, sans-serif" font-size="12" fill="#246b48" font-weight="700">TURN 4 • EXAMPLE</text><text x="508" y="401" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: B. The new analysis establishes</text><text x="508" y="423" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">overload. I revise my earlier answer.</text><rect x="22" y="514" width="916" height="70" rx="10" fill="#e6edf5" stroke="none"/><text x="34" y="534" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">Measure: first unsupported commitment = turn 2; correction = turn 4 in this made-up path. Repeat with the</text><text x="34" y="556" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">clue moved to turn 3.</text></svg>