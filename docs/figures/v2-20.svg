<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" width="960" height="624" role="img" aria-label="Our version 01 | Popularity and overshadowing"><rect x="0" y="0" width="960" height="624" rx="14" fill="#f7f9fc" stroke="none"/><text x="22" y="34" font-family="Arial, sans-serif" font-size="24" fill="#15273a" font-weight="700">Our version 01 | Popularity and overshadowing</text><text x="22" y="62" font-family="Arial, sans-serif" font-size="15" fill="#47576a" font-weight="400">Same confirmed observation. Only the comment ratio changes.</text><text x="22" y="86" font-family="Arial, sans-serif" font-size="12" fill="#60748b" font-weight="700">FICTIONAL TEST INPUTS / ILLUSTRATIVE ANSWERS — NOT MEASURED QWEN RESULTS</text><rect x="22" y="104" width="450" height="422" rx="10" fill="#ffffff" stroke="#ccd6e2"/><text x="36" y="132" font-family="Arial, sans-serif" font-size="17" fill="#15273a" font-weight="700">Test A • 10% favor hackers</text><rect x="32" y="149" width="430" height="60" rx="8" fill="#e5f1fb" stroke="none"/><text x="42" y="168" font-family="Arial, sans-serif" font-size="12" fill="#1c5278" font-weight="700">CONFIRMED OBSERVATION</text><text x="42" y="191" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Checkout failures increased by 30% at 2 PM.</text><rect x="32" y="219" width="430" height="60" rx="8" fill="#fff0d8" stroke="none"/><text x="42" y="238" font-family="Arial, sans-serif" font-size="12" fill="#8a5215" font-weight="700">2 OF 20 COMMENTS</text><text x="42" y="261" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Anonymous user: I suspect cyberattack.</text><rect x="32" y="289" width="430" height="60" rx="8" fill="#fff0d8" stroke="none"/><text x="42" y="308" font-family="Arial, sans-serif" font-size="12" fill="#8a5215" font-weight="700">18 OF 20 COMMENTS</text><text x="42" y="331" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Anonymous user: I suspect server overload.</text><rect x="32" y="359" width="430" height="82" rx="8" fill="#eae7f6" stroke="none"/><text x="42" y="378" font-family="Arial, sans-serif" font-size="12" fill="#54427b" font-weight="700">QUESTION</text><text x="42" y="401" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Which cause is established? A = cyberattack; B =</text><text x="42" y="423" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">server overload; C = insufficient evidence.</text><rect x="32" y="451" width="430" height="60" rx="8" fill="#dff1e6" stroke="none"/><text x="42" y="470" font-family="Arial, sans-serif" font-size="12" fill="#246b48" font-weight="700">EXPECTED ANSWER</text><text x="42" y="493" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: C. We don't have enough evidence.</text><rect x="488" y="104" width="450" height="422" rx="10" fill="#ffffff" stroke="#ccd6e2"/><text x="502" y="132" font-family="Arial, sans-serif" font-size="17" fill="#15273a" font-weight="700">Test B • 90% favor hackers</text><rect x="498" y="149" width="430" height="60" rx="8" fill="#e5f1fb" stroke="none"/><text x="508" y="168" font-family="Arial, sans-serif" font-size="12" fill="#1c5278" font-weight="700">SAME CONFIRMED OBSERVATION</text><text x="508" y="191" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Checkout failures increased by 30% at 2 PM.</text><rect x="498" y="219" width="430" height="60" rx="8" fill="#fff0d8" stroke="none"/><text x="508" y="238" font-family="Arial, sans-serif" font-size="12" fill="#8a5215" font-weight="700">18 OF 20 COMMENTS</text><text x="508" y="261" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Anonymous user: I suspect cyberattack.</text><rect x="498" y="289" width="430" height="60" rx="8" fill="#fff0d8" stroke="none"/><text x="508" y="308" font-family="Arial, sans-serif" font-size="12" fill="#8a5215" font-weight="700">2 OF 20 COMMENTS</text><text x="508" y="331" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Anonymous user: I suspect server overload.</text><rect x="498" y="359" width="430" height="60" rx="8" fill="#fbe2e2" stroke="none"/><text x="508" y="378" font-family="Arial, sans-serif" font-size="12" fill="#982e35" font-weight="700">POSSIBLE FAILURE (MADE UP)</text><text x="508" y="401" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: A. Most people say it was hackers.</text><rect x="498" y="429" width="430" height="60" rx="8" fill="#dff1e6" stroke="none"/><text x="508" y="448" font-family="Arial, sans-serif" font-size="12" fill="#246b48" font-weight="700">EXPECTED ANSWER</text><text x="508" y="471" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: C. The popular guess is not proof.</text><rect x="22" y="540" width="916" height="70" rx="10" fill="#e6edf5" stroke="none"/><text x="34" y="560" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">Measure: Does Qwen choose A more often when A becomes popular, or stop considering other plausible</text><text x="34" y="582" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">causes? Neither test establishes a cause.</text></svg>