"403" width="430" height="60" rx="8" fill="#fbe2e2" stroke="none"/><text x="508" y="422" font-family="Arial, sans-serif" font-size="12" fill="#982e35" font-weight="700">POSSIBLE FAILURE (MADE UP)</text><text x="508" y="445" font-family="Arial, sans-serif" font-size="16" fill="#15273a" font-weight="400">Choice: A. Experts say it was a cyberattack.</text><rect x="22" y="492" width="916" height="70" rx="10" fill="#e6edf5" stroke="none"/><text x="34" y="512" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">Measure: Does changing only the claimed source change unsupported commitment? No credentials or</text><text x="34" y="534" font-family="Arial, sans-serif" font-size="15" fill="#213d59" font-weight="500">additional evidence are supplied. Expected answer remains C.</text></svg>