[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foresight-ai"
version = "0.1.0"
description = "Evidence-grounded LLM reliability experiments in noisy social information environments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tokenization = ["transformers>=4.51,<6", "tokenizers>=0.21"]
stance = ["scikit-learn>=1.4,<2", "joblib>=1.3"]
bert = ["scikit-learn>=1.4,<2", "joblib>=1.3", "transformers>=4.51,<5", "torch>=2.2", "accelerate>=1.0"]

[project.scripts]
foresight = "foresight_ai.cli:main"
foresight-stance = "foresight_ai.stance_cli:main"
foresight-averitec = "foresight_ai.prepare_averitec:main"
foresight-audit = "foresight_ai.evidence_audit:main"

[tool.setuptools]
packages = ["foresight_ai"]
