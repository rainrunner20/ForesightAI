name: Python checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Validate the CLI demo
        run: python -m foresight_ai.cli --provider mock --output outputs/check.json
      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
